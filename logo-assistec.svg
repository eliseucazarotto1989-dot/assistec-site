<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 80">
  <!-- Globe with orbital arrows - Assistec Informática original logo (blue) -->
  <g transform="translate(2, 2) scale(0.95)">
    <!-- Globe sphere outline -->
    <circle cx="38" cy="38" r="30" stroke="#0072C6" stroke-width="2.5" fill="none"/>

    <!-- Vertical meridian (3D curve) -->
    <ellipse cx="32" cy="38" rx="13" ry="30" stroke="#0072C6" stroke-width="1.6" fill="none"/>

    <!-- Horizontal equator -->
    <path d="M8,38 Q38,32 68,38" stroke="#0072C6" stroke-width="1.4" fill="none"/>

    <!-- Upper latitude -->
    <path d="M14,24 Q38,19 62,24" stroke="#0072C6" stroke-width="1" fill="none" opacity="0.4"/>

    <!-- Lower latitude -->
    <path d="M14,52 Q38,47 62,52" stroke="#0072C6" stroke-width="1" fill="none" opacity="0.4"/>

    <!-- Top orbital arrow -->
    <path d="M18,12 C28,2 52,0 66,14" stroke="#0072C6" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <polygon points="66,14 58,6 60,16" fill="#0072C6"/>

    <!-- Middle orbital arrow -->
    <path d="M24,30 C36,22 56,22 68,32" stroke="#0072C6" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <polygon points="68,32 60,24 62,34" fill="#0072C6"/>

    <!-- Bottom orbital arrow -->
    <path d="M58,64 C48,74 24,76 10,62" stroke="#0072C6" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <polygon points="10,62 18,70 16,60" fill="#0072C6"/>
  </g>

  <!-- ASSISTEC text -->
  <text x="88" y="40" font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif" font-size="40" font-weight="900" fill="#0072C6" letter-spacing="1.5">ASSISTEC</text>

  <!-- INFORMÁTICA text -->
  <text x="90" y="64" font-family="'Arial', 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#0072C6" letter-spacing="3">INFORMÁTICA</text>
</svg>
